# OpenCode Web UI password — generated once, preserved across helm upgrade.
{{- $ns := include "mcp-workshop.namespace" . }}
{{- $existing := lookup "v1" "Secret" $ns "agentsherpa-password" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: agentsherpa-password
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: agentsherpa-password
    app.kubernetes.io/part-of: mcp-workshop
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
