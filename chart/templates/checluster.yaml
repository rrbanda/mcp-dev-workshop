{{- if .Values.cheCluster.create }}
# The CheCluster and global ConfigMap live in openshift-devspaces.
# Ensure the namespace exists before creating resources in it.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-devspaces
---
# CheCluster — creates the DevSpaces dashboard, workspace controller, and registries.
# Requires the DevSpaces operator to be installed first.
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
spec:
  components:
    cheServer:
      debug: false
    dashboard: {}
    devWorkspace: {}
    devfileRegistry: {}
    pluginRegistry: {}
  devEnvironments:
    defaultNamespace:
      template: "<username>-devspaces"
    secondsOfInactivityBeforeIdling: -1
    secondsOfRunBeforeIdling: -1
  networking: {}
{{- end }}
