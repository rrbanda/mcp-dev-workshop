# RBAC — grant the participant edit access in their workspace namespace,
# pod/exec for terminal, and read access to the opencode-web-password Secret.
{{- $ns := include "mcp-workshop.namespace" . }}
{{- if .Values.user.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.user.name }}-edit
  namespace: {{ $ns }}
subjects:
  - kind: User
    name: {{ .Values.user.name }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-pod-exec
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-pod-exec
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ $ns }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: workspace-pod-exec
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-sa-edit
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ $ns }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-web-secret-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["opencode-web-password"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-web-secret-reader
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ $ns }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: opencode-web-secret-reader
  apiGroup: rbac.authorization.k8s.io
