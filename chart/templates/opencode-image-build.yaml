{{- if .Values.opencodeBuild.enabled }}
# OpenCode (AgentRB) DevSpaces image.
# Two modes based on whether opencodeBuild.binaryUrl is set:
#   - URL set:   Dockerfile source + ConfigChange trigger (fully automatic)
#   - URL empty: Binary source (one-time: oc start-build --from-dir=<dir>)
apiVersion: v1
kind: Namespace
metadata:
  name: opencode-build
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: devspaces-opencode
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: devspaces-opencode
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
spec:
  output:
    to:
      kind: ImageStreamTag
      name: devspaces-opencode:latest
  source:
{{- if .Values.opencodeBuild.binaryUrl }}
    type: Dockerfile
    dockerfile: |
      FROM {{ .Values.opencodeBuild.baseImage }}
      USER root
      RUN curl -fsSL {{ .Values.opencodeBuild.binaryUrl | quote }} -o /usr/local/bin/opencode && \
          chmod 755 /usr/local/bin/opencode && \
          (command -v rg >/dev/null 2>&1 || \
           curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz \
           | tar xzf - --strip-components=1 -C /usr/local/bin ripgrep-14.1.1-x86_64-unknown-linux-musl/rg) && \
          pip install --no-cache-dir uv "mcp[cli]>=2.0"
      USER 1001
{{- else }}
    type: Binary
    binary: {}
    dockerfile: |
      FROM {{ .Values.opencodeBuild.baseImage }}
      USER root
      COPY opencode /usr/local/bin/opencode
      RUN chmod 755 /usr/local/bin/opencode && \
          (command -v rg >/dev/null 2>&1 || \
           curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz \
           | tar xzf - --strip-components=1 -C /usr/local/bin ripgrep-14.1.1-x86_64-unknown-linux-musl/rg) && \
          pip install --no-cache-dir uv "mcp[cli]>=2.0"
      USER 1001
{{- end }}
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: {{ .Values.opencodeBuild.baseImage }}
{{- if .Values.opencodeBuild.binaryUrl }}
  triggers:
    - type: ConfigChange
{{- end }}
---
# Grant image-puller so all DevSpaces workspaces can pull the custom image.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-image-puller-devspaces
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    name: system:serviceaccounts:openshift-devspaces
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-image-puller-authenticated
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
