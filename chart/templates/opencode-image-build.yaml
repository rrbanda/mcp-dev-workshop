{{- if .Values.opencodeBuild.enabled }}
# OpenCode custom DevSpaces image — build infrastructure.
# Creates a namespace, ImageStream, and BuildConfig that produces an image
# with OpenCode CLI + xdg-open stub + pip tooling pre-installed.
# The ConfigChange trigger starts a build automatically on first create.
apiVersion: v1
kind: Namespace
metadata:
  name: opencode-build
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: devspaces-opencode
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: devspaces-opencode
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
spec:
  output:
    to:
      kind: ImageStreamTag
      name: devspaces-opencode:latest
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.redhat.io/devspaces/udi-rhel8:latest
      USER root
      RUN curl -fsSL https://opencode.ai/install | OPENCODE_VERSION={{ .Values.opencodeBuild.opencodeVersion }} bash && \
          cp /home/user/.opencode/bin/opencode /usr/local/bin/opencode && \
          chmod 755 /usr/local/bin/opencode && \
          printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/xdg-open && \
          chmod 755 /usr/local/bin/xdg-open
      RUN pip install --no-cache-dir uv "mcp[cli]>=2.0" && \
          mkdir -p /home/user/.config/opencode /home/user/.local/share/opencode && \
          echo '{{ include "mcp-workshop.opencodeJson" . }}' \
            > /home/user/.config/opencode/opencode.json && \
          echo '{"vllm":{"type":"api","key":"EMPTY"}}' > /home/user/.local/share/opencode/auth.json && \
          chown -R 1001:0 /home/user/.config/opencode /home/user/.local/share/opencode && \
          chmod -R g=u /home/user/.config/opencode /home/user/.local/share/opencode
      ENV NODE_TLS_REJECT_UNAUTHORIZED=0
      USER 1001
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: registry.redhat.io/devspaces/udi-rhel8:latest
  triggers:
    - type: ConfigChange
---
# Grant image-puller so all DevSpaces workspaces can pull the custom image.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-image-puller-devspaces
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    name: system:serviceaccounts:openshift-devspaces
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workshop-image-puller-authenticated
  namespace: opencode-build
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
