# ---- LLM endpoint (any OpenAI-compatible URL) ----
# The LLM can be on this cluster, another cluster, or an external API.
# For MaaS on another cluster: use the MaaS gateway URL + API key.
llm:
  # REQUIRED — full base URL including /v1, e.g.:
  #   Same cluster:    https://llama32-fp8-ai501.apps.this-cluster.example.com/v1
  #   MaaS (other):    https://maas.apps.other-cluster.example.com/ai-serving/model-name/v1
  #   External API:    https://api.openai.com/v1
  baseUrl: ""
  # API key — "EMPTY" for unauthenticated endpoints, real key for MaaS or external APIs
  apiKey: "EMPTY"
  # Model ID as the endpoint expects it in chat/completions requests
  modelId: ""
  tokens:
    context: 20000
    output: 8192
  # JSON string merged into every API request body.
  # qwen/vLLM: '{"chat_template_kwargs":{"enable_thinking":false}}'
  # Gemini 2.5: '{"reasoning_effort":"none"}'
  extraBody: '{"chat_template_kwargs":{"enable_thinking":false}}'

# ---- Workshop repo (pre-cloned into every workspace) ----
workshop:
  repo: "https://github.com/rrbanda/mcp-dev-workshop.git"
  branch: "main"

# ---- DevSpaces CheCluster ----
cheCluster:
  # Set true if DevSpaces operator is installed but no CheCluster exists yet.
  # Set false if CheCluster already exists (e.g., PCA cluster, RHPDS lab).
  create: false

# ---- OpenCode image build ----
opencodeBuild:
  enabled: true
  opencodeVersion: "1.15.13"

# ---- DevSpaces global config (VS Code extension recommendations) ----
globalConfig:
  # true for the first Helm release only; false for subsequent releases
  # to avoid Helm ownership conflict on the shared ConfigMap.
  enabled: true

# ---- Participant ----
# Each Helm release deploys one user's workspace.
# The deploy script loops over users and calls helm install per user.
user:
  name: ""              # e.g. user1 — set by deploy script
  workspaceName: "code-workspace-1"
