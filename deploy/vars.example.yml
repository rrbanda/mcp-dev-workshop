# MCP Workshop — Ansible inventory variables.
# Copy this file and fill in your cluster-specific values.
# Usage: cp deploy/vars.example.yml deploy/vars.yml && vi deploy/vars.yml
#
# NEVER commit vars.yml — it is in .gitignore.
---
# LLM endpoint — can be on a different cluster or external API.
# The workshop cluster only runs DevSpaces; the LLM runs elsewhere.
#
# Examples:
#   Same cluster (KServe route):
#     llm_url: "https://llama32-fp8-ai501.apps.workshop-cluster.example.com/v1"
#     llm_api_key: "EMPTY"
#     model_id: "llama32-fp8"
#
#   MaaS on another cluster (PCA):
#     llm_url: "https://maas.apps.pca-cluster.example.com/ai-serving/qwen25-coder-7b/v1"
#     llm_api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"
#     model_id: "qwen25-coder-7b"
#
#   External API:
#     llm_url: "https://api.openai.com/v1"
#     llm_api_key: "sk-proj-xxxxxxxx"
#     model_id: "gpt-4o"
#
llm_url: ""                    # REQUIRED
llm_api_key: "EMPTY"           # REQUIRED if endpoint needs auth (MaaS, external)
model_id: ""                   # REQUIRED — model name as the endpoint expects it
context_tokens: 20000
output_tokens: 4096

# Participants
user_prefix: "user"            # RHPDS = "user", PCA = "dev-user"
user_count: 30

# DevSpaces
install_operator: true         # false if DevSpaces operator is already installed
create_checluster: true        # false if CheCluster already exists

# Workshop repo (cloned into every workspace)
workshop_repo: "https://github.com/rrbanda/mcp-dev-workshop.git"
workshop_branch: "main"

# OpenCode
opencode_version: "1.15.13"
