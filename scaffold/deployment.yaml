apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-market-mcp
  labels:
    app: stock-market-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-market-mcp
  template:
    metadata:
      labels:
        app: stock-market-mcp
    spec:
      containers:
        - name: server
          image: image-registry.openshift-image-registry.svc:5000/MY_NAMESPACE/stock-market-mcp:latest
          ports:
            - containerPort: 8080
          env:
            - name: MCP_TRANSPORT
              value: "streamable-http"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: stock-market-mcp
spec:
  selector:
    app: stock-market-mcp
  ports:
    - port: 8080
      targetPort: 8080
